name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Lint, Test, Build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Unit tests
        run: bun run test

      - name: E2E tests
        run: bun run test:e2e
        env:
          CUBBY_SKIP_REAL_CLAUDE_E2E: "1"
          CUBBY_MOCK_CLAUDE_PROVIDER: "1"
